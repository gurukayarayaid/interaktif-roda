<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pasangkan Lambang Pancasila</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #game-container {
            background: white;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* Menggunakan flex-start agar aliran elemen atas-bawah stabil */
            padding: 30px 60px;
            position: relative;
            overflow: hidden;
        }

        /* --- TOMBOL FULLSCREEN PANAH 4 ARAH --- */
        #btn-fullscreen {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 45px;
            height: 45px;
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            transition: background-color 0.2s, transform 0.1s;
        }

        #btn-fullscreen:hover {
            background-color: #e0e0e0;
        }

        #btn-fullscreen:active {
            transform: scale(0.95);
        }

        #btn-fullscreen svg {
            width: 24px;
            height: 24px;
            fill: #444;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            font-size: 2.2rem;
            margin-top: 5px;
            margin-bottom: 25px;
            font-weight: bold;
            width: 100%;
        }

        /* Konten Utama Game (Layout Kiri dan Kanan) */
        #main-content {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 40px;
            flex: 1; /* Otomatis mengambil sisa ruang tengah secara dinamis */
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        /* Sisi Kiri: Daftar Sila (Teks) */
        #target-container {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            gap: 15px; /* Memberikan jarak antar-baris agar tidak berdempetan */
            height: 100%;
            justify-content: center;
        }

        .row-sila {
            display: flex;
            background: #fdfdfd;
            border: 2px dashed #bdc3c7;
            border-radius: 14px;
            align-items: center;
            padding: 12px 20px;
            /* Menggunakan min-height dinamis dan membiarkannya memanjang jika teks meluap */
            min-height: 90px; 
            height: auto;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .text-sila {
            flex: 1;
            font-size: 1.45rem;
            font-weight: 600;
            color: #34495e;
            line-height: 1.4; /* Meningkatkan kerenggangan baris teks agar terbaca sempurna */
            padding-right: 15px;
            word-break: break-word; /* Memastikan teks panjang pecah dengan rapi */
        }

        /* Kotak Tempat Drop Lambang Gambar */
        .box-drop {
            width: 75px;
            height: 75px;
            border: 2px dashed #95a5a6;
            border-radius: 12px;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex-shrink: 0;
            overflow: hidden;
        }

        /* Sisi Kanan: Kolom Pilihan Lambang Berkas Gambar */
        #pool-container {
            flex: 0.7;
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            padding: 25px 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            align-content: center;
            justify-items: center;
            height: auto;
            max-height: 100%;
        }

        /* Elemen Ubin Tempat Gambar Lambang */
        .item-lambang {
            width: 105px;
            height: 105px;
            background: white;
            border: 3px solid #dbdbdb;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.06);
            overflow: hidden;
            transition: transform 0.1s, border-color 0.2s, box-shadow 0.2s;
            padding: 10px;
        }

        .item-lambang:hover {
            transform: scale(1.05);
            border-color: #3498db;
        }

        .item-lambang.selected {
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
            transform: scale(1.05);
            background-color: #e8f8f5;
        }

        /* Pengaturan Rendering File Gambar */
        .symbol-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }

        /* Status Pasangan Benar */
        .row-correct {
            background-color: #e8f8f5;
            border-color: #2ecc71;
            border-style: solid;
        }
        
        .row-correct .box-drop {
            border-color: #2ecc71;
            background: transparent;
        }

        /* Animasi Salah Getar */
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        /* Layar Status Berhasil (Overlay) */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 40px;
            text-align: center;
        }

        #win-screen {
            background: linear-gradient(135deg, #e8f8f5 0%, #d1f2eb 100%);
        }

        #win-screen h1 {
            font-size: 3.5rem;
            color: #27ae60;
            margin-bottom: 20px;
        }

        #win-screen p {
            font-size: 1.8rem;
            color: #7f8c8d;
            margin-bottom: 30px;
        }

        .btn-action {
            padding: 15px 50px;
            font-size: 1.6rem;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46,204,113,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #27ae60;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .hidden { display: none !important; }
    

    /* ===== OPTIMASI LAYAR HP (tanpa scroll) ===== */
@media (max-width: 700px), (orientation: landscape) and (max-height: 520px) {
  html, body { height: 100%; overflow: hidden; }
  body { min-height: 100vh; min-height: 100dvh; }
  body { padding: 6px; }
  #game-container { height: calc(100vh - 12px); height: calc(100dvh - 12px); min-height: 0; padding: 42px 8px 10px; }
  #btn-fullscreen { top: 5px; right: 6px; width: 30px; height: 30px; }
  #btn-fullscreen svg { width: 16px; height: 16px; }
  h2 { font-size: 1.2rem !important; margin-bottom: 8px !important; }
  #main-content { gap: 10px; margin-bottom: 6px; }
  #target-container { flex: 1.2; gap: 6px; }
  .row-sila { min-height: 56px; padding: 6px 8px; border-radius: 10px; border-width: 2px; }
  .text-sila { font-size: 0.98rem !important; line-height: 1.3 !important; padding-right: 6px; }
  .box-drop { width: 44px; height: 44px; border-radius: 8px; }
  #pool-container { flex: 0.85; gap: 8px; padding: 10px 8px; border-radius: 12px; }
  .item-lambang { width: 62px; height: 62px; padding: 5px; border-radius: 10px; border-width: 2px; }
  .screen { padding: 24px 14px; }
  #win-screen h1 { font-size: 1.8rem !important; margin-bottom: 10px !important; }
  #win-screen p { font-size: 1.05rem !important; margin-bottom: 20px !important; }
  .btn-action { padding: 14px 34px; font-size: 1.2rem !important; }
    }
    </style>

<body>

    <div id="game-container">
        <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Layar Penuh">
            <svg viewBox="0 0 24 24">
                <path d="M10 21v-2H6.41l4.5-4.5-1.41-1.41-4.5 4.5V14H3v7h7zm4-18v2h3.59l-4.5 4.5 1.41 1.41 4.5-4.5V10h2V3h-7zm-4.5 7.91l-4.5-4.5V10H3V3h7v2H6.41l4.5 4.5-1.41 1.41zM21 14h-2v3.59l-4.5-4.5-1.41 1.41 4.5 4.5H14v2h7v-7z"/>
            </svg>
        </button>

        <h2>Pasangkan Lambang Pancasila</h2>

        <div id="main-content">
            <div id="target-container"></div>
            
            <div id="pool-container"></div>
        </div>

        <div id="win-screen" class="screen hidden">
            <h1>Luar Biasa! 🎉</h1>
            <p>Kamu berhasil memasangkan seluruh lambang Pancasila dengan benar!</p>
            <button class="btn-action" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const dataPancasilas = [
            { id: "1", sila: "1. Ketuhanan Yang Maha Esa", gambar: "bintang.png" },
            { id: "2", sila: "2. Kemanusiaan yang adil dan beradab", gambar: "rantai.png" },
            { id: "3", sila: "3. Persatuan Indonesia", gambar: "beringin.png" },
            { id: "4", sila: "4. Kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan", gambar: "banteng.png" },
            { id: "5", sila: "5. Keadilan sosial bagi seluruh rakyat Indonesia", gambar: "padi_kapas.png" }
        ];

        let itemTerpilih = null;
        let audioCtx = null;

        function toggleFullscreen() {
            let doc = window.document;
            let docEl = doc.documentElement;

            let requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            let cancelFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullscreen) {
                    requestFullscreen.call(docEl).catch(err => {
                        console.log(`Gagal Fullscreen: ${err.message}`);
                    });
                }
            } else {
                if (cancelFullscreen) {
                    cancelFullscreen.call(doc);
                }
            }
        }

        function mainkanSuara(tipe) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        function acakArray(array) {
            let salinan = [...array];
            for (let i = salinan.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [salinan[i], salinan[j]] = [salinan[j], salinan[i]];
            }
            return salinan;
        }

        function inisialisasiGame() {
            itemTerpilih = null;
            
            const targetContainer = document.getElementById('target-container');
            const poolContainer = document.getElementById('pool-container');
            
            targetContainer.innerHTML = '';
            poolContainer.innerHTML = '';

            // Render Sila berurutan 1 sampai 5
            dataPancasilas.forEach(data => {
                const row = document.createElement('div');
                row.className = 'row-sila';
                row.setAttribute('data-id-target', data.id);
                row.onclick = () => cocokkanItem(row);

                const txt = document.createElement('div');
                txt.className = 'text-sila';
                txt.innerText = data.sila;

                const boxDrop = document.createElement('div');
                boxDrop.className = 'box-drop';
                boxDrop.id = `target-${data.id}`;

                row.appendChild(txt);
                row.appendChild(boxDrop);
                targetContainer.appendChild(row);
            });

            // Render Kotak Lambang dengan Berkas Gambar Lokal .png secara Acak
            const dataLambangAcak = acakArray(dataPancasilas);
            dataLambangAcak.forEach(data => {
                const item = document.createElement('div');
                item.className = 'item-lambang';
                item.setAttribute('data-id-lambang', data.id);
                
                item.innerHTML = `<img src="${data.gambar}" class="symbol-img" alt="Lambang Sila">`;
                
                item.onclick = (e) => {
                    e.stopPropagation();
                    pilihLambang(item);
                };
                poolContainer.appendChild(item);
            });
        }

        function pilihLambang(elemenItem) {
            if (itemTerpilih) {
                itemTerpilih.classList.remove('selected');
            }
            itemTerpilih = elemenItem;
            itemTerpilih.classList.add('selected');
        }

        function cocokkanItem(barisSila) {
            if (!itemTerpilih) return;
            if (barisSila.classList.contains('row-correct')) return; 

            const idTarget = barisSila.getAttribute('data-id-target');
            const idLambang = itemTerpilih.getAttribute('data-id-lambang');

            if (idTarget === idLambang) {
                mainkanSuara('benar');
                
                const targetKotak = document.getElementById(`target-${idTarget}`);
                
                itemTerpilih.classList.remove('selected');
                itemTerpilih.onclick = null; 
                itemTerpilih.style.cursor = 'default';
                itemTerpilih.style.border = 'none';
                itemTerpilih.style.boxShadow = 'none';
                itemTerpilih.style.transform = 'none';
                
                targetKotak.appendChild(itemTerpilih);
                barisSila.classList.add('row-correct');
                
                itemTerpilih = null; 
                setTimeout(cekStatusMenang, 400);
            } else {
                mainkanSuara('salah');
                barisSila.classList.add('shake');
                setTimeout(() => barisSila.classList.remove('shake'), 300);
            }
        }

        function cekStatusMenang() {
            const jumlahBenar = document.querySelectorAll('.row-correct').length;
            if (jumlahBenar === 5) {
                document.getElementById('win-screen').classList.remove('hidden');
            }
        }

        function mulaiUlangGame() {
            document.getElementById('win-screen').classList.add('hidden');
            inisialisasiGame();
        }

        window.onload = inisialisasiGame;
    </script>
<!-- ===== PAKSA LANDSCAPE + PAS SATU LAYAR (otomatis) ===== -->
<div id="rodaRotate" aria-hidden="true">
  <div class="rr-inner">
    <div class="rr-phone"><div class="rr-screen"><span>&#8635;</span></div></div>
    <div class="rr-title">PUTAR LAYAR KE MODE <b>LANDSCAPE</b></div>
    <div class="rr-sub">Supaya soal dan tombol jawaban pilihan ganda tampil lengkap dalam satu layar, tanpa scroll.</div>
    <button type="button" id="rodaRotateSkip">Tetap lanjut di potret</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var doc = document, root = doc.documentElement;
  var overlay = doc.getElementById('rodaRotate');
  var skip = false, busyFs = false;
  var inIframe = false;
  try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
  var hasPlayer = !!doc.querySelector('.player');

  function mq(q) { try { return window.matchMedia(q).matches; } catch (e) { return false; } }
  function isCoarse() { return mq('(pointer: coarse)') || mq('(any-pointer: coarse)'); }
  function isPortrait() { return mq('(orientation: portrait)') || window.innerHeight > window.innerWidth; }
  function isFs() {
    return !!(doc.fullscreenElement || doc.webkitFullscreenElement || doc.msFullscreenElement || doc.mozFullScreenElement);
  }
  function playerOpen() {
    if (!hasPlayer) return true;
    var p = doc.querySelector('.player');
    return !!(p && p.classList.contains('open'));
  }
  function canLock() {
    return !!(window.screen && screen.orientation && typeof screen.orientation.lock === 'function');
  }
  function lockLandscape() {
    try {
      var o = screen.orientation || screen.msOrientation || screen.mozOrientation;
      if (o && typeof o.lock === 'function') {
        var p = o.lock('landscape');
        if (p && typeof p.catch === 'function') p.catch(function () {});
      }
    } catch (e) {}
  }
  function refreshOverlay() {
    if (!overlay) return;
    var show = !skip && isCoarse() && isPortrait() && playerOpen();
    overlay.style.display = show ? 'flex' : 'none';
  }
  function finishFs() { setTimeout(function () { busyFs = false; }, 700); }

  function autoFullscreen() {
    if (skip || busyFs) return;
    if (isFs()) { lockLandscape(); return; }
    if (!isCoarse() || !playerOpen() || !canLock()) return;
    if (inIframe) {
      try { window.parent.postMessage({ rodaForceLandscape: 1 }, '*'); } catch (e) {}
      return;
    }
    var r = root.requestFullscreen || root.webkitRequestFullscreen || root.msFullscreenElement && root.msRequestFullscreen;
    if (!r) return;
    busyFs = true;
    try {
      var res = r.call(root);
      if (res && typeof res.then === 'function') {
        res.then(function () { lockLandscape(); finishFs(); }, function () { finishFs(); });
      } else { lockLandscape(); finishFs(); }
    } catch (e) { busyFs = false; }
  }

  ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange', 'mozfullscreenchange'].forEach(function (ev) {
    doc.addEventListener(ev, function () { if (isFs()) lockLandscape(); refreshOverlay(); fitAll(); });
  });
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.rodaForceLandscape) autoFullscreen();
  });
  window.addEventListener('resize', function () { refreshOverlay(); fitAll(); });
  window.addEventListener('orientationchange', function () {
    refreshOverlay();
    setTimeout(function () { fitAll(); refreshOverlay(); }, 260);
  });
  doc.addEventListener('touchstart', function (e) {
    try {
      if (e.target && e.target.closest &&
          e.target.closest('#rodaRotateSkip, [onclick*="ullscreen"], .btn-fullscreen, #btn-fullscreen, #fsBtn')) return;
    } catch (err) {}
    autoFullscreen();
  }, { passive: true });

  var skipBtn = doc.getElementById('rodaRotateSkip');
  if (skipBtn) skipBtn.addEventListener('click', function () {
    skip = true;
    refreshOverlay();
    try {
      if (isFs()) (doc.exitFullscreen || doc.webkitExitFullscreen || doc.msExitFullscreen).call(doc);
    } catch (e) {}
  });

  /* --- Pastikan teks soal selalu muat di kotaknya (auto shrink) --- */
  function fitSoalEl(el) {
    var box = el.parentElement;
    if (!box) return;
    var h = box.clientHeight;
    if (h < 20) return;
    var cs = window.getComputedStyle(box);
    var others = 0, count = 0, i, c;
    for (i = 0; i < box.children.length; i++) {
      c = box.children[i];
      if (c === el || !c.offsetHeight) continue;
      others += c.offsetHeight;
      count++;
    }
    var gap = parseFloat(cs.rowGap) || 0;
    var avail = h - (parseFloat(cs.paddingTop) || 0) - (parseFloat(cs.paddingBottom) || 0) - others - gap * count;
    if (avail < 24) avail = Math.max(24, Math.round(h * 0.6));
    el.style.maxHeight = avail + 'px';
    el.style.fontSize = '';
    var size = parseFloat(window.getComputedStyle(el).fontSize) || 16, guard = 0;
    while (el.scrollHeight > el.clientHeight + 1 && size > 9 && guard++ < 40) {
      size = Math.max(9, size - Math.max(0.8, size * 0.07));
      el.style.fontSize = size.toFixed(2) + 'px';
    }
  }
  function fitAll() {
    var list = doc.querySelectorAll('#target-soal, #target-lagu, #target-suku, .provinsi-container > div, .soal-container > div');
    for (var i = 0; i < list.length; i++) {
      try { fitSoalEl(list[i]); } catch (e) {}
    }
  }
  try {
    var mo = new MutationObserver(function () { fitAll(); });
    mo.observe(doc.body, {
      subtree: true, childList: true, characterData: true,
      attributes: true, attributeFilter: ['class']
    });
  } catch (e) {}

  fitAll();
  refreshOverlay();
  window.addEventListener('load', function () { fitAll(); refreshOverlay(); });
  setTimeout(function () { fitAll(); refreshOverlay(); }, 250);
  setTimeout(function () { fitAll(); refreshOverlay(); }, 1200);
})();
</script>

</body>
