<!DOCTYPE html>
<html lang="jv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Basa Jawa Kelas 3 SD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px; 
            position: relative; /* Menjadi acuan tombol agar bisa mepet ke ujung layar */
        }

        #game-container {
            background: white;
            width: 100%;
            max-width: 100%;
            height: 98vh;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
        }

        .top-border {
            width: 95%;
            height: 12px;
            background-color: #81c784;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        /* Tombol fullscreen digeser mepet ke pojok kanan luar halaman */
        #btn-fullscreen {
            position: absolute;
            top: 15px; 
            right: 15px; /* Mepet ke sisi kanan layar monitor/browser */
            z-index: 99; /* Memastikan berada di lapisan paling atas */
            background: none; 
            border: none; 
            color: #2e7d32;
            font-size: 2.8rem; 
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        #btn-fullscreen:hover {
            color: #1b5e20;
            transform: scale(1.1); 
        }

        #status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #2e7d32;
            padding: 0 20px;
            z-index: 5;
            margin-bottom: 10px;
            font-size: 2.5rem;
            margin-top: 10px; 
        }

        .provinsi-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
            padding: 0 20px;
        }

        #target-soal {
            font-size: 3.8rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(-100%);
            line-height: 1.4;
        }

        .slide-in {
            animation: slideInAnim 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }

        @keyframes slideInAnim {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .slide-out {
            animation: slideOutAnim 0.4s forwards ease-in;
        }

        @keyframes slideOutAnim {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        #feedback {
            font-size: 10rem;
            font-weight: bold;
            position: absolute;
            top: 25%;
            z-index: 10;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .correct-feedback { color: #4CAF50; opacity: 1 !important; transform: scale(1.2) !important; }
        .wrong-feedback { color: #F44336; opacity: 1 !important; transform: scale(1.2) !important; }

        #grid-jawaban {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 95%;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .btn-jawaban {
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 3.2rem;
            font-weight: bold;
            padding: 25px 20px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px;
            line-height: 1.2;
        }

        .btn-jawaban:hover {
            opacity: 0.9;
        }

        .btn-jawaban:active {
            transform: scale(0.95);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 40px;
            text-align: center;
        }

        #start-screen {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
        }

        #start-screen h1 {
            font-size: 5rem;
            color: #1b5e20;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        #start-screen p {
            font-size: 2.5rem;
            color: #2e7d32;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .screen h1 {
            font-size: 5rem;
            color: #333;
            margin-bottom: 25px;
        }

        .screen p {
            font-size: 2.2rem;
        }

        .btn-action {
            padding: 25px 60px;
            font-size: 2.5rem;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(46,125,50,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #1b5e20;
        }

        .btn-restart {
            background-color: #1976d2;
            box-shadow: 0 5px 15px rgba(25,118,210,0.4);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Tombol Diposisikan Aman di Pojok Kanan Halaman -->
    <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Layar Penuh">⛶</button>

    <div id="game-container">
        <div id="start-screen" class="screen">
            <h1>Kuis Pinter<br>Basa Jawa</h1>
            <p>Kelas 3 SD - Semester 1</p>
            <button class="btn-action" onclick="klikMulaiGame()">Mulai Dolanan</button>
        </div>

        <div class="top-border"></div>

        <div id="status-bar">
            <div id="info-nyawa">❤️ Nyawa: 3</div>
            <div id="info-skor">Skor: 0</div>
        </div>

        <div id="feedback"></div>

        <div class="provinsi-container">
            <div id="target-soal">Ngenteni soal...</div>
        </div>

        <div class="top-border" style="margin-bottom: 10px;"></div>

        <div id="grid-jawaban"></div>

        <div id="game-over-screen" class="screen hidden">
            <h1 style="color: #d32f2f;">Eman-Eman!</h1>
            <p style="margin-bottom: 20px; color: #555;">Nyawamu wis entek, Cah Bagus/Ayu.</p>
            <p style="margin-bottom: 30px; font-weight: bold; font-size: 3rem;" id="skor-akhir-kalah"></p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Baleni Maneh</button>
        </div>

        <div id="win-screen" class="screen hidden">
            <h1 style="color: #2e7d32;">Bocah Pinter! 🎉</h1>
            <p style="margin-bottom: 20px;">Kabeh soal bisa dijawab bener!</p>
            <p style="margin-bottom: 30px; font-weight: bold; font-size: 3rem;">Skormu: 100</p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Baleni Maneh</button>
        </div>
    </div>

    <script>
        const databaseSoal = [
            { soal: "Kosok baline (lawan kata) tembung \"bungah\" yaiku ...", pilihan: ["Seneng", "Susah", "Gumbira", "Pinter"], jawabanBenar: "Susah" },
            { soal: "Anak pitik arane yaiku ...", pilihan: ["Cindhil", "Kuthuk", "Bledug", "Cempe"], jawabanBenar: "Kuthuk" },
            { soal: "Kukuruyuk iku swarane kewan ...", pilihan: ["Bebek", "Kucing", "Pitik Jago", "Kambing"], jawabanBenar: "Pitik Jago" },
            { soal: "Tokoh Pandawa iku cacahe (jumlahe) ana ...", pilihan: ["Telu", "Papat", "Lima", "Nem"], jawabanBenar: "Lima" },
            { soal: "Pembarepe (anak nomer siji) Pandawa yaiku ...", pilihan: ["Yudhistira", "Bima", "Arjuna", "Nakula"], jawabanBenar: "Yudhistira" },
            { soal: "Raden Arjuna iku prigel banget babagan ...", pilihan: ["Bal-balan", "Nembang", "Manah (Memanah)", "Mlayu"], jawabanBenar: "Manah (Memanah)" },
            { soal: "Yen ditimbali (dipanggil) wong tuwa, kudu mangsuli ...", pilihan: ["Hoo", "Apa", "Dalem", "Sek"], jawabanBenar: "Dalem" },
            { soal: "Simbah nembe ... sekul goreng ing pawon.", pilihan: ["Mangan", "Nedha", "Dhahar", "Nguntal"], jawabanBenar: "Dhahar" },
            { soal: "Satriya ing Jodhipati sing awake gagah lan gedhe yaiku ...", pilihan: ["Janaka", "Werkudara", "Sadewa", "Puntadewa"], jawabanBenar: "Werkudara" },
            { soal: "Raden Nakula lan Sadewa iku satriya sing ...", pilihan: ["Kembar", "Musuhan", "Lara", "Nakale pol"], jawabanBenar: "Kembar" }
        ];

        const warnaTombol = ["#4db6ac", "#4fc3f7", "#ffb74d", "#ba68c8"];
        let sisaPertanyaan = [];
        let pertanyaanAktif = null;
        let nyawa = 3;
        let skor = 0;
        let indeksSoal = 0;
        let audioCtx = null;
        let sedangAnimasi = false; 

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Gagal mengaktifkan fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function mainkanSuara(tipe) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        function klikMulaiGame() {
            document.getElementById('start-screen').classList.add('hidden');
            mainkanSuara('benar'); 
            siapkanKomponenGame();
        }

        function siapkanKomponenGame() {
            nyawa = 3;
            skor = 0;
            indeksSoal = 0;
            sedangAnimasi = false;
            sisaPertanyaan = [...databaseSoal]; 
            perbaruiStatus();
            tampilkanSoalNext();
        }

        function mulaiUlangGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            siapkanKomponenGame();
        }

        function buatTombolJawaban(arrayPilihan) {
            const grid = document.getElementById('grid-jawaban');
            grid.innerHTML = ''; 
            const pilihanDiacak = [...arrayPilihan].sort(() => Math.random() - 0.5);
            pilihanDiacak.forEach((teksJawaban, idx) => {
                const tombol = document.createElement('button');
                tombol.className = 'btn-jawaban';
                tombol.innerText = teksJawaban;
                tombol.style.backgroundColor = warnaTombol[idx % 4];
                tombol.onclick = () => cekJawaban(teksJawaban, tombol);
                grid.appendChild(tombol);
            });
        }

        function tampilkanSoalNext() {
            if (indeksSoal >= sisaPertanyaan.length) {
                document.getElementById('win-screen').classList.remove('hidden');
                return;
            }
            pertanyaanAktif = sisaPertanyaan[indeksSoal];
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "";
            txtSoal.innerHTML = pertanyaanAktif.soal;
            buatTombolJawaban(pertanyaanAktif.pilihan);
            setTimeout(() => { txtSoal.className = "slide-in"; }, 20);
        }

        function gantiSoalAnimasi() {
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "slide-out";
            setTimeout(() => {
                indeksSoal++;
                tampilkanSoalNext();
            }, 400);
        }

        function cekJawaban(jawabanDipilih, elemenTombol) {
            if (sedangAnimasi) return;
            sedangAnimasi = true;
            const feedbackEl = document.getElementById('feedback');
            if (jawabanDipilih === pertanyaanAktif.jawabanBenar) {
                mainkanSuara('benar');
                skor += 10;
                feedbackEl.innerText = "✓";
                feedbackEl.className = "correct-feedback";
                setTimeout(() => {
                    feedbackEl.className = "";
                    perbaruiStatus();
                    gantiSoalAnimasi();
                    sedangAnimasi = false;
                }, 600);
            } else {
                mainkanSuara('salah');
                nyawa--;
                feedbackEl.innerText = "✕";
                feedbackEl.className = "wrong-feedback";
                elemenTombol.classList.add('shake');
                setTimeout(() => {
                    feedbackEl.className = "";
                    elemenTombol.classList.remove('shake');
                    perbaruiStatus();
                    if (nyawa <= 0) {
                        document.getElementById('skor-akhir-kalah').innerText = `Skor Pungkasan: ${skor}`;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    } else {
                        gantiSoalAnimasi();
                    }
                    sedangAnimasi = false;
                }, 600);
            }
        }

        function perbaruiStatus() {
            document.getElementById('info-nyawa').innerText = `❤️ Nyawa: ${nyawa}`;
            document.getElementById('info-skor').innerText = `Skor: ${skor}`;
        }
    </script>
</body>
</html>
