<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lagu Daerah dan Provinsi asalnya</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        #game-container {
            background: white;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 60px; /* Sedikit mengurangi padding atas-bawah agar lebih hemat ruang vertical */
            position: relative;
            overflow: hidden;
        }

        /* --- TOMBOL FULLSCREEN PANAH 4 ARAH --- */
        #btn-fullscreen {
            position: absolute;
            top: 15px;
            right: 25px;
            width: 45px;
            height: 45px;
            background-color: #f0f0f0;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 30;
            transition: background-color 0.2s, transform 0.1s;
        }

        #btn-fullscreen:hover {
            background-color: #e0e0e0;
        }

        #btn-fullscreen:active {
            transform: scale(0.95);
        }

        #btn-fullscreen svg {
            width: 24px;
            height: 24px;
            fill: #444;
        }

        /* Status Bar (Nyawa & Skor) */
        #status-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            z-index: 5;
            margin-bottom: 5px;
        }

        /* Decorative Border (Garis Putus-putus Sempit & Rapat) */
        .top-border {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 1200px;
            justify-content: center;
            margin-bottom: 10px;
        }
        
        .dash {
            width: 35px;
            height: 12px;
            background-color: #ccc;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* Container Tempat Soal Muncul (Lagu) */
        .provinsi-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            min-height: 100px; /* Dihemat agar tidak memakan ruang vertikal laptop */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin: 5px 0;
            padding: 5px;
        }

        #target-lagu {
            font-size: 2.4rem;
            font-weight: bold;
            color: #2c3e50;
            text-align: center;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(-100%);
            line-height: 1.3;
        }

        /* ================= ANIMASI TRANSISI SOAL ================= */
        .slide-in {
            animation: slideInAnim 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideInAnim {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .slide-out {
            animation: slideOutAnim 0.4s forwards ease-in;
        }

        @keyframes slideOutAnim {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        /* ========================================================= */

        /* Feedback Overlay (Check/Cross) */
        #feedback {
            font-size: 6rem;
            font-weight: bold;
            position: absolute;
            top: 30%;
            z-index: 10;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .correct-feedback { color: #4CAF50; opacity: 1 !important; transform: scale(1.2) !important; }
        .wrong-feedback { color: #F44336; opacity: 1 !important; transform: scale(1.2) !important; }

        /* --- PERUBAHAN UTAMA: GRID JAWABAN MENJADI 3 KOLOM --- */
        #grid-provinsi {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Diubah menjadi 3 kolom sejajar */
            gap: 12px; /* Jarak antar tombol dioptimalkan */
            width: 100%;
            max-width: 1200px;
            margin-top: auto;
            margin-bottom: 15px; /* Mengamankan jarak dari batas bawah browser/taskbar */
        }

        .btn-provinsi {
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.25rem; /* Font tetap besar dan proporsional */
            font-weight: bold;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 65px; /* Sedikit dipendekkan agar menghemat area vertikal */
            line-height: 1.2;
        }

        .btn-provinsi:active {
            transform: scale(0.96);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        /* Layar Status (Overlay Screens) */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 40px;
            text-align: center;
        }

        #start-screen {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        #start-screen h1 {
            font-size: 3.5rem;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        #start-screen p {
            font-size: 1.6rem;
            color: #5d6d7e;
            margin-bottom: 40px;
        }

        .screen h1 {
            font-size: 4rem;
            color: #333;
            margin-bottom: 20px;
        }

        .btn-action {
            padding: 20px 60px;
            font-size: 1.8rem;
            background-color: #FF5722;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(255,87,34,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #E64A19;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-restart {
            background-color: #2196F3;
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
        }
        .btn-restart:hover {
            background-color: #1E88E5;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Layar Penuh">
            <svg viewBox="0 0 24 24">
                <path d="M10 21v-2H6.41l4.5-4.5-1.41-1.41-4.5 4.5V14H3v7h7zm4-18v2h3.59l-4.5 4.5 1.41 1.41 4.5-4.5V10h2V3h-7zm-4.5 7.91l-4.5-4.5V10H3V3h7v2H6.41l4.5 4.5-1.41 1.41zM21 14h-2v3.59l-4.5-4.5-1.41 1.41 4.5 4.5H14v2h7v-7z"/>
            </svg>
        </button>

        <div id="start-screen" class="screen">
            <h1>Game Edukasi<br>Lagu Daerah</h1>
            <p>Tebak asal provinsi dari judul lagu daerah yang muncul!</p>
            <button class="btn-action" onclick="klikMulaiGame()">Mulai Game</button>
        </div>

        <div id="status-bar">
            <div id="info-nyawa">❤️ Nyawa: 3</div>
            <div id="info-skor">Skor: 0</div>
        </div>

        <div class="top-border">
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
        </div>

        <div id="feedback"></div>

        <div class="provinsi-container">
            <div id="target-lagu">Memuat...</div>
        </div>

        <div class="top-border">
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
        </div>

        <div id="grid-provinsi"></div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p style="margin-bottom: 30px; font-size: 1.8rem;" id="skor-akhir-kalah">Skor Akhir Kamu: 0</p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>

        <div id="win-screen" class="screen hidden">
            <h1>Kamu Menang! 🎉</h1>
            <p style="margin-bottom: 30px; font-size: 1.8rem;">Luar biasa! Semua lagu daerah tertebak!</p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const databaseLagu = [
            { lagu: "\"Bungong Jeumpa\"", provinsi: "Aceh", warna: "#E51C23" },
            { lagu: "\"Sinanggar Tulo\"", provinsi: "Sumatera Utara", warna: "#00B0FF" },
            { lagu: "\"Kampuang Nan Jauh Di Mato\"", provinsi: "Sumatera Barat", warna: "#FF9800" },
            { lagu: "\"Kicir-Kicir\"", provinsi: "DKI Jakarta", warna: "#4CAF50" },
            { lagu: "\"Manuk Dadali\"", provinsi: "Jawa Barat", warna: "#9C27B0" },
            { lagu: "\"Gundhul Pacul\"", provinsi: "Jawa Tengah", warna: "#009688" },
            { lagu: "\"Ampar-Ampar Pisang\"", provinsi: "Kalimantan Selatan", warna: "#E91E63" },
            { lagu: "\"Anak Kambing Saya\"", provinsi: "Nusa Tenggara Timur", warna: "#3F51B5" },
            { lagu: "\"Rasa Sayange\"", provinsi: "Maluku", warna: "#795548" },
            { lagu: "\"Yamko Rambe Yamko\"", provinsi: "Papua", warna: "#607D8B" }
        ];

        let sisaPertanyaan = [];
        let pertanyaanAktif = null;
        let nyawa = 3;
        let skor = 0;
        let audioCtx = null;
        let sedangAnimasi = false; 

        function toggleFullscreen() {
            let doc = window.document;
            let docEl = doc.documentElement;

            let requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            let cancelFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

            if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
                if (requestFullscreen) {
                    requestFullscreen.call(docEl).catch(err => {
                        console.log(`Gagal mengaktifkan Fullscreen: ${err.message}`);
                    });
                }
            } else {
                if (cancelFullscreen) {
                    cancelFullscreen.call(doc);
                }
            }
        }

        function mainkanSuara(tipe) {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.log("Audio di-skip");
            }
        }

        function klikMulaiGame() {
            document.getElementById('start-screen').classList.add('hidden');
            try {
                mainkanSuara('benar'); 
            } catch(err) {}
            siapkanKomponenGame();
        }

        function siapkanKomponenGame() {
            nyawa = 3;
            skor = 0;
            sedangAnimasi = false;
            sisaPertanyaan = [...databaseLagu];
            
            perbaruiStatus();
            buatGridTombol();
            pilihPertanyaanAcak();
        }

        function mulaiUlangGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            siapkanKomponenGame();
        }

        function buatGridTombol() {
            const grid = document.getElementById('grid-provinsi');
            grid.innerHTML = ''; 

            databaseLagu.forEach(item => {
                const tombol = document.createElement('button');
                tombol.className = 'btn-provinsi';
                tombol.id = `provinsi-${item.provinsi.replace(/\s+/g, '-')}`;
                tombol.innerText = item.provinsi;
                tombol.style.backgroundColor = item.warna;
                
                tombol.onclick = () => cekJawaban(item.provinsi, tombol);
                grid.appendChild(tombol);
            });
        }

        function gantiSoalMajuKeKanan() {
            const txtLagu = document.getElementById('target-lagu');
            txtLagu.className = "slide-out";
            
            setTimeout(() => {
                if (sisaPertanyaan.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                    return;
                }
                pilihPertanyaanAcak();
            }, 400);
        }

        function pilihPertanyaanAcak() {
            if (sisaPertanyaan.length === 0) return;
            
            const indeksAcak = Math.floor(Math.random() * sisaPertanyaan.length);
            pertanyaanAktif = sisaPertanyaan[indeksAcak];

            const txtLagu = document.getElementById('target-lagu');
            txtLagu.className = "";
            txtLagu.innerText = pertanyaanAktif.lagu;
            
            setTimeout(() => {
                txtLagu.className = "slide-in";
            }, 20);
        }

        function cekJawaban(namaProvinsiYangKlik, elemenTombol) {
            if (sedangAnimasi || elemenTombol.style.opacity === '0') return;
            sedangAnimasi = true;

            const feedbackEl = document.getElementById('feedback');

            if (namaProvinsiYangKlik === pertanyaanAktif.provinsi) {
                mainkanSuara('benar');
                skor += 10;
                
                feedbackEl.innerText = "✓";
                feedbackEl.className = "correct-feedback";

                elemenTombol.style.opacity = '0';
                elemenTombol.style.pointerEvents = 'none';

                sisaPertanyaan = sisaPertanyaan.filter(item => item.provinsi !== namaProvinsiYangKlik);

                setTimeout(() => {
                    feedbackEl.className = "";
                    perbaruiStatus();
                    gantiSoalMajuKeKanan();
                    sedangAnimasi = false;
                }, 600);

            } else {
                mainkanSuara('salah');
                nyawa--;

                feedbackEl.innerText = "✕";
                feedbackEl.className = "wrong-feedback";
                elemenTombol.classList.add('shake');

                setTimeout(() => {
                    feedbackEl.className = "";
                    elemenTombol.classList.remove('shake');
                    perbaruiStatus();

                    if (nyawa <= 0) {
                        document.getElementById('skor-akhir-kalah').innerText = `Skor Akhir Kamu: ${skor}`;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    } else {
                        gantiSoalMajuKeKanan();
                    }
                    sedangAnimasi = false;
                }, 600);
            }
        }

        function perbaruiStatus() {
            document.getElementById('info-nyawa').innerText = `❤️ Nyawa: ${nyawa}`;
            document.getElementById('info-skor').innerText = `Skor: ${skor}`;
        }
    </script>
</body>
</html>
