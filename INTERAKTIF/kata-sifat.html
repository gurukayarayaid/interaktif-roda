<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kata Sifat - Kelas 3 SD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #game-container {
            background: white;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 20px;
            position: relative;
            overflow: hidden;
        }

        /* Top Decorative Border */
        .top-border {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-bottom: 20px;
        }
        .dash {
            width: 15px;
            height: 15px;
            background-color: #ccc;
            border-radius: 2px;
        }

        /* Status & Question Area */
        #status-bar {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-weight: bold;
            color: #555;
            padding: 0 10px;
            z-index: 5;
        }
        .status-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        #info-nama {
            font-size: 0.9rem;
            color: #2b8a3e;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
            text-align: left;
            width: 100%;
        }

        /* Container Soal agar teks panjang muat dengan baik */
        .provinsi-container {
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
            padding: 0 10px;
        }

        #target-soal {
            font-size: 1.25rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(-100%);
            line-height: 1.5;
        }

        /* ================= ANIMASI TRANSISI SOAL ================= */
        .slide-in {
            animation: slideInAnim 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.15);
        }

        @keyframes slideInAnim {
            0% { transform: translateX(-100%); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        .slide-out {
            animation: slideOutAnim 0.4s forwards ease-in;
        }

        @keyframes slideOutAnim {
            0% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        /* ========================================================= */

        /* Feedback Overlay (Check/Cross) */
        #feedback {
            font-size: 4rem;
            font-weight: bold;
            position: absolute;
            top: 30%;
            z-index: 10;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .correct-feedback { color: #4CAF50; opacity: 1 !important; transform: scale(1.2) !important; }
        .wrong-feedback { color: #F44336; opacity: 1 !important; transform: scale(1.2) !important; }

        /* Grid Pilihan Jawaban (2 Kolom x 2 Baris = 4 Pilihan) */
        #grid-jawaban {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 390px;
            margin-top: auto;
            margin-bottom: 20px;
        }

        .btn-jawaban {
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            padding: 15px 10px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 85px;
            line-height: 1.3;
        }

        .btn-jawaban:active {
            transform: scale(0.95);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        /* Layar Status (Overlay Screens) */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        /* Gaya Spesifik Layar Mulai */
        #start-screen {
            background: linear-gradient(135deg, #fff9db 0%, #fff3bf 100%);
        }

        #start-screen h1 {
            font-size: 2.1rem;
            color: #e67e22;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        #start-screen p {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .select-siswa {
            width: 85%;
            padding: 12px;
            font-size: 1rem;
            border: 2px solid #ff922b;
            border-radius: 10px;
            margin-bottom: 30px;
            background-color: white;
            color: #333;
            outline: none;
            font-weight: 500;
        }

        .screen h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 15px;
        }

        /* Leaderboard Style */
        .leaderboard-container {
            width: 100%;
            max-height: 250px;
            overflow-y: auto;
            margin: 15px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #fafafa;
        }

        .table-leaderboard {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        .table-leaderboard th, .table-leaderboard td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table-leaderboard th {
            background-color: #ff922b;
            color: white;
            position: sticky;
            top: 0;
        }

        .table-leaderboard tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .btn-action {
            padding: 15px 40px;
            font-size: 1.3rem;
            background-color: #ff922b;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255,146,43,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #f76707;
        }

        .btn-action:disabled {
            background-color: #cccccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-action:active:not(:disabled) {
            transform: scale(0.95);
        }

        .btn-restart {
            background-color: #2196F3;
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
            margin-top: 10px;
        }
        .btn-restart:hover {
            background-color: #1E88E5;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- Halaman Login Dropdown Nama -->
        <div id="start-screen" class="screen">
            <h1>Kuis Kata Sifat</h1>
            <p>Kelas 3 SD - Bahasa Indonesia</p>
            
            <select id="dropdown-siswa" class="select-siswa" onchange="validasiPilihSiswa()">
                <option value="" disabled selected>--- Pilih Namamu Di Sini ---</option>
                <option value="ACHMAD DHAFIN KHALIF ALGHIFARI">ACHMAD DHAFIN KHALIF ALGHIFARI</option>
                <option value="ALFIRA NAHDA RAFANDA">ALFIRA NAHDA RAFANDA</option>
                <option value="ARSYILA ROMEESA FARZANA">ARSYILA ROMEESA FARZANA</option>
                <option value="ASSYFA PUTRI NAURA ZASKIA">ASSYFA PUTRI NAURA ZASKIA</option>
                <option value="ATIQAH FATIMATUS ZAHRA">ATIQAH FATIMATUS ZAHRA</option>
                <option value="ELLVINO GAVRIEL ALVARO">ELLVINO GAVRIEL ALVARO</option>
                <option value="FALISA AMALIA PUTRI">FALISA AMALIA PUTRI</option>
                <option value="GIBRAN KEENANDRA ARDIANSYAH">GIBRAN KEENANDRA ARDIANSYAH</option>
                <option value="KANIA DWI NUR MAULIDDIAH">KANIA DWI NUR MAULIDDIAH</option>
                <option value="MUHAMMAD ABDULLOH FADIL">MUHAMMAD ABDULLOH FADIL</option>
                <option value="MUHAMMAD NATHAN HAFIZ PRADIPTA">MUHAMMAD NATHAN HAFIZ PRADIPTA</option>
                <option value="MUHAMMAD NAUFAL AL RAJABI">MUHAMMAD NAUFAL AL RAJABI</option>
                <option value="MUHAMMAD RAKA ISLAMUDDIN">MUHAMMAD RAKA ISLAMUDDIN</option>
                <option value="MUHAMMAD RAKHA FATKHUL HALIM">MUHAMMAD RAKHA FATKHUL HALIM</option>
                <option value="NAFISA AZZAHRA KHUSNANDAR">NAFISA AZZAHRA KHUSNANDAR</option>
                <option value="NIKMATUL NISA">NIKMATUL NISA</option>
                <option value="OKTAVIA PUTRI GANESHA">OKTAVIA PUTRI GANESHA</option>
                <option value="RAYSA NABILAH PUTRI">RAYSA NABILAH PUTRI</option>
                <option value="RIKA ELVINA">RIKA ELVINA</option>
                <option value="SAYYID MAULANA IBRAHIM">SAYYID MAULANA IBRAHIM</option>
                <option value="TIKA ASSYIFAH ARRUM">TIKA ASSYIFAH ARRUM</option>
                <option value="MUHAMAD RAHMADANI">MUHAMAD RAHMADANI</option>
            </select>

            <button id="btn-mulai" class="btn-action" onclick="klikMulaiGame()" disabled>Mulai Game</button>
        </div>

        <div class="top-border">
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
        </div>

        <div id="status-bar">
            <div id="info-nama">Siswa: -</div>
            <div class="status-row">
                <div id="info-nyawa">❤️ Nyawa: 3</div>
                <div id="info-skor">Skor: 0</div>
            </div>
        </div>

        <div id="feedback"></div>

        <div class="provinsi-container">
            <div id="target-soal">Memuat Soal...</div>
        </div>

        <div class="top-border" style="margin-bottom: 10px;">
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
            <div class="dash"></div><div class="dash"></div><div class="dash"></div>
        </div>

        <div id="grid-jawaban"></div>

        <!-- SCREEN GAME OVER -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <p id="skor-akhir-kalah" style="font-size: 1.1rem; font-weight: bold; color: #c92a2a;"></p>
            
            <h3 style="margin-top: 15px; color: #555;">🏆 LEADERBOARD 🏆</h3>
            <div class="leaderboard-container">
                <table class="table-leaderboard" id="tabel-leaderboard-kalah">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Nama Murid</th>
                            <th>Skor</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>

        <!-- SCREEN WIN -->
        <div id="win-screen" class="screen hidden">
            <h1>Kamu Hebat! 🎉</h1>
            <p id="skor-akhir-menang" style="font-size: 1.1rem; font-weight: bold; color: #2b8a3e;"></p>
            
            <h3 style="margin-top: 15px; color: #555;">🏆 LEADERBOARD 🏆</h3>
            <div class="leaderboard-container">
                <table class="table-leaderboard" id="tabel-leaderboard-menang">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Nama Murid</th>
                            <th>Skor</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        // Data 10 Soal Kata Sifat Kelas 3 SD berdasarkan tingkat kesulitan
        const databaseSoal = [
            // --- 3 SOAL LEVEL RENDAH ---
            { 
                soal: "Gajah memiliki badan yang besar, sedangkan semut memiliki badan yang ...", 
                pilihan: ["Kecil", "Tinggi", "Lebar", "Panjang"], 
                jawabanBenar: "Kecil" 
            },
            { 
                soal: "Beni selalu membuang sampah pada tempatnya. Beni anak yang ...", 
                pilihan: ["Bersih", "Jorok", "Malas", "Bodoh"], 
                jawabanBenar: "Bersih" 
            },
            { 
                soal: "Lawan kata (antonim) dari kata \"rajin\" adalah ...", 
                pilihan: ["Malas", "Pintar", "Baik", "Sombong"], 
                jawabanBenar: "Malas" 
            },
            
            // --- 4 SOAL LEVEL SEDANG ---
            { 
                soal: "Manakah di bawah ini yang semuanya merupakan kata sifat?", 
                pilihan: ["Rumah, meja, lari", "Ramah, cerdik, lambat", "Makan, tidur, duduk", "Merah, pohon, pasar"], 
                jawabanBenar: "Ramah, cerdik, lambat" 
            },
            { 
                soal: "\"Meskipun nilainya bagus, Siti tidak pernah pamer.\" Sifat Siti adalah ...", 
                pilihan: ["Sombong", "Rendah hati", "Pemalu", "Penakut"], 
                jawabanBenar: "Rendah hati" 
            },
            { 
                soal: "Adik menangis ketakutan saat lampu kamar mati karena suasananya sangat ...", 
                pilihan: ["Gelap", "Terang", "Sepi", "Ramai"], 
                jawabanBenar: "Gelap" 
            },
            { 
                soal: "Rani selalu menyapa teman dan gurunya dengan senyuman. Rani adalah anak yang ...", 
                pilihan: ["Ramah", "Pemarah", "Sombong", "Cerdik"], 
                jawabanBenar: "Ramah" 
            },

            // --- 3 SOAL LEVEL TINGGI ---
            { 
                soal: "Perhatikan kalimat: \"Kancil yang **cerdik** bisa menyeberangi sungai dengan mengelabui buaya yang **serakah**.\"<br>Kata sifat pada kalimat di atas adalah ...", 
                pilihan: ["Kancil dan sungai", "Cerdik dan serakah", "Menyeberangi dan buaya", "Mengelabui dan sungai"], 
                jawabanBenar: "Cerdik dan serakah" 
            },
            { 
                soal: "Kata sifat yang tepat untuk menggambarkan suasana pasar yang dipenuhi banyak orang berbelanja adalah ...", 
                pilihan: ["Sunyi", "Gersang", "Ramai", "Luas"], 
                jawabanBenar: "Ramai" 
            },
            { 
                soal: "Kalimat di bawah ini yang menggunakan kata sifat untuk menggambarkan watak seseorang adalah ...", 
                pilihan: ["Baju baru Edo berwarna biru.", "Dino sangat jujur saat mengembalikan dompet yang hilang.", "Meja kayu itu sangat tebal.", "Kopi ayah rasanya pahit."], 
                jawabanBenar: "Dino sangat jujur saat mengembalikan dompet yang hilang." 
            }
        ];

        const warnaTombol = ["#E51C23", "#00B0FF", "#FF9800", "#4CAF50"];

        let sisaPertanyaan = [];
        let pertanyaanAktif = null;
        let nyawa = 3;
        let skor = 0;
        let namaSiswa = "";
        let audioCtx = null;
        let sedangAnimasi = false; 

        function validasiPilihSiswa() {
            const dropdown = document.getElementById('dropdown-siswa');
            const btnMulai = document.getElementById('btn-mulai');
            if(dropdown.value !== "") {
                btnMulai.disabled = false;
            }
        }

        function mainkanSuara(tipe) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.log("Audio di-skip");
            }
        }

        function klikMulaiGame() {
            const dropdown = document.getElementById('dropdown-siswa');
            namaSiswa = dropdown.value;
            
            if(!namaSiswa) return alert("Silakan pilih nama terlebih dahulu!");

            document.getElementById('start-screen').classList.add('hidden');
            mainkanSuara('benar'); 
            siapkanKomponenGame();
        }

        function siapkanKomponenGame() {
            nyawa = 3;
            skor = 0;
            sedangAnimasi = false;
            sisaPertanyaan = [...databaseSoal]; 
            
            perbaruiStatus();
            pilihPertanyaanAcak();
        }

        function mulaiUlangGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
            document.getElementById('dropdown-siswa').value = "";
            document.getElementById('btn-mulai').disabled = true;
        }

        function buatTombolJawaban(arrayPilihan) {
            const grid = document.getElementById('grid-jawaban');
            grid.innerHTML = ''; 

            arrayPilihan.forEach((teksJawaban, indeks) => {
                const tombol = document.createElement('button');
                tombol.className = 'btn-jawaban';
                tombol.innerText = teksJawaban;
                tombol.style.backgroundColor = warnaTombol[indeks]; 
                
                tombol.onclick = () => cekJawaban(teksJawaban, tombol);
                grid.appendChild(tombol);
            });
        }

        function gantiSoalMajuKeKanan() {
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "slide-out";
            
            setTimeout(() => {
                if (sisaPertanyaan.length === 0) {
                    simpanDanTampilkanLeaderboard(true);
                    return;
                }
                pilihPertanyaanAcak();
            }, 400);
        }

        function pilihPertanyaanAcak() {
            if (sisaPertanyaan.length === 0) return;
            
            const indeksAcak = Math.floor(Math.random() * sisaPertanyaan.length);
            pertanyaanAktif = sisaPertanyaan[indeksAcak];

            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "";
            txtSoal.innerHTML = pertanyaanAktif.soal; 
            
            buatTombolJawaban(pertanyaanAktif.pilihan);

            setTimeout(() => {
                txtSoal.className = "slide-in";
            }, 20);
        }

        function cekJawaban(jawabanDipilih, elemenTombol) {
            if (sedangAnimasi) return;
            sedangAnimasi = true;

            const feedbackEl = document.getElementById('feedback');

            if (jawabanDipilih === pertanyaanAktif.jawabanBenar) {
                mainkanSuara('benar');
                skor += 10;
                
                feedbackEl.innerText = "✓";
                feedbackEl.className = "correct-feedback";

                sisaPertanyaan = sisaPertanyaan.filter(item => item.soal !== pertanyaanAktif.soal);

                setTimeout(() => {
                    feedbackEl.className = "";
                    perbaruiStatus();
                    gantiSoalMajuKeKanan();
                    sedangAnimasi = false;
                }, 600);

            } else {
                mainkanSuara('salah');
                nyawa--;

                feedbackEl.innerText = "✕";
                feedbackEl.className = "wrong-feedback";
                elemenTombol.classList.add('shake'); 

                setTimeout(() => {
                    feedbackEl.className = "";
                    elemenTombol.classList.remove('shake');
                    perbaruiStatus();

                    if (nyawa <= 0) {
                        simpanDanTampilkanLeaderboard(false);
                    } else {
                        gantiSoalMajuKeKanan(); 
                    }
                    sedangAnimasi = false;
                }, 600);
            }
        }

        function perbaruiStatus() {
            document.getElementById('info-nama').innerText = `Siswa: ${namaSiswa}`;
            document.getElementById('info-nyawa').innerText = `❤️ Nyawa: ${nyawa}`;
            document.getElementById('info-skor').innerText = `Skor: ${skor}`;
        }

        function simpanDanTampilkanLeaderboard(apakahMenang) {
            // Ambil data leaderboard lama dari LocalStorage
            let leaderboardData = JSON.parse(localStorage.getItem('kuisKataSifatLeaderboard')) || [];
            
            // Cek apakah siswa ini sudah ada di data sebelumnya
            let dataSiswaLama = leaderboardData.find(item => item.nama === namaSiswa);
            if (dataSiswaLama) {
                // Jika skor baru lebih tinggi, update skornya
                if (skor > dataSiswaLama.skor) {
                    dataSiswaLama.skor = skor;
                }
            } else {
                // Jika data baru, masukkan ke array
                leaderboardData.push({ nama: namaSiswa, skor: skor });
            }

            // Urutkan berdasarkan skor tertinggi ke terendah
            leaderboardData.sort((a, b) => b.skor - a.skor);

            // Simpan kembali ke LocalStorage
            localStorage.setItem('kuisKataSifatLeaderboard', JSON.stringify(leaderboardData));

            // Tampilkan ke tabel HTML berdasarkan screen akhir
            if(apakahMenang) {
                document.getElementById('skor-akhir-menang').innerText = `Skor Kamu: ${skor}`;
                isiTabelLeaderboard('tabel-leaderboard-menang', leaderboardData);
                document.getElementById('win-screen').classList.remove('hidden');
            } else {
                document.getElementById('skor-akhir-kalah').innerText = `Skor Akhir Kamu: ${skor}`;
                isiTabelLeaderboard('tabel-leaderboard-kalah', leaderboardData);
                document.getElementById('game-over-screen').classList.remove('hidden');
            }
        }

        function isiTabelLeaderboard(idTabel, data) {
            const tbody = document.getElementById(idTabel).getElementsByTagName('tbody')[0];
            tbody.innerHTML = ""; // Bersihkan tabel terlebih dahulu

            data.forEach((item, indeks) => {
                let row = tbody.insertRow();
                let cellRank = row.insertCell(0);
                let cellNama = row.insertCell(1);
                let cellSkor = row.insertCell(2);

                // Tambahkan tanda mahkota untuk peringkat 1
                cellRank.innerHTML = indeks === 0 ? `🥇 1` : indeks + 1;
                cellNama.innerText = item.nama;
                cellSkor.innerText = item.skor;

                // Highlight baris jika itu adalah nama user yang sedang bermain
                if(item.nama === namaSiswa) {
                    row.style.fontWeight = 'bold';
                    row.style.backgroundColor = '#fff3bf';
                }
            });
        }
    </script>
</body>
</html>
