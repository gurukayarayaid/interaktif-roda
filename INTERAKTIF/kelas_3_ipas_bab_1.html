<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis IPAS Bab 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            position: relative; 
        }

        #game-container {
            background: white;
            width: 100%;
            max-width: 100%; 
            min-height: 95vh; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px 40px;
            position: relative;
            border-radius: 15px; 
        }

        .top-border {
            width: 95%;
            height: 12px;
            background-color: #ccc;
            border-radius: 6px;
            margin: 15px 0;
            flex-shrink: 0;
        }

        #btn-fullscreen {
            position: absolute;
            top: 15px; 
            right: 15px; 
            z-index: 99; 
            background: none; 
            border: none; 
            color: #555;
            font-size: 2.8rem; 
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
        }
        #btn-fullscreen:hover {
            color: #333;
            transform: scale(1.1); 
        }

        #status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #555;
            padding: 0 20px;
            z-index: 5;
            font-size: 2.5rem; 
            flex-shrink: 0;
        }

        .provinsi-container {
            width: 95%;
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px 0;
            min-height: 200px; 
        }

        #target-soal {
            font-size: clamp(2.2rem, 3.5vw, 3.8rem); 
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            position: relative; 
            width: 100%;
            max-width: 1200px;
            opacity: 0;
            line-height: 1.4;
            word-wrap: break-word; 
            overflow: visible; 
        }

        .slide-in {
            animation: fadeInAnim 0.3s forwards ease-out;
        }

        @keyframes fadeInAnim {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        .slide-out {
            animation: fadeOutAnim 0.2s forwards ease-in;
        }

        @keyframes fadeOutAnim {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.95); }
        }

        #feedback {
            font-size: 10rem; 
            font-weight: bold;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            z-index: 10;
            opacity: 0;
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .correct-feedback { color: #4CAF50; opacity: 1 !important; transform: translate(-50%, -50%) scale(1.2) !important; }
        .wrong-feedback { color: #F44336; opacity: 1 !important; transform: translate(-50%, -50%) scale(1.2) !important; }

        #grid-jawaban {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            width: 100%;
            max-width: 95%; 
            margin-top: 15px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .btn-jawaban {
            border: none;
            border-radius: 20px;
            color: white;
            font-size: 3.2rem; 
            font-weight: bold;
            padding: 25px 20px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 6px 10px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 140px; 
            line-height: 1.2;
        }

        .btn-jawaban:hover {
            opacity: 0.9;
        }

        .btn-jawaban:active {
            transform: scale(0.95);
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
            100% { transform: translateX(0); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
        }

        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 40px;
            text-align: center;
        }

        #start-screen {
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
        }

        #start-screen h1 {
            font-size: 5rem; 
            color: #0d47a1;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        #start-screen p {
            font-size: 2.5rem;
            color: #37474f;
            margin-bottom: 50px;
            font-weight: 500;
        }

        .screen h1 {
            font-size: 5rem;
            color: #333;
            margin-bottom: 25px;
        }

        .screen p {
            font-size: 2.2rem;
        }

        .btn-action {
            padding: 25px 60px;
            font-size: 2.5rem; 
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(25,118,210,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-action:hover {
            background-color: #0d47a1;
        }

        .btn-restart {
            background-color: #2196F3;
            box-shadow: 0 5px 15px rgba(33,150,243,0.4);
        }
        .btn-restart:hover {
            background-color: #1E88E5;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <button id="btn-fullscreen" onclick="toggleFullscreen()" title="Layar Penuh">⛶</button>

    <div id="game-container">
        <div id="start-screen" class="screen">
            <h1>Kuis IPAS Bab 1</h1>
            <p>Yuk, uji pemahamanmu mengenai materi IPAS Semester 1 Bab 1!</p>
            <button class="btn-action" onclick="klikMulaiGame()">Mulai Kuis</button>
        </div>

        <div class="top-border"></div>

        <div id="status-bar">
            <div id="info-nyawa">❤️ Nyawa: 3</div>
            <div id="info-skor">Skor: 0</div>
        </div>

        <div id="feedback"></div>

        <div class="provinsi-container">
            <div id="target-soal">Memuat Soal...</div>
        </div>

        <div class="top-border"></div>

        <div id="grid-jawaban"></div>

        <div id="game-over-screen" class="screen hidden">
            <h1>Selesai!</h1>
            <p style="margin-bottom: 30px; font-weight: bold; font-size: 3rem;" id="skor-akhir-kalah"></p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Coba Lagi</button>
        </div>

        <div id="win-screen" class="screen hidden">
            <h1>Hebat Sekali! 🎉</h1>
            <p style="margin-bottom: 30px; font-size: 2.5rem;">Kamu berhasil menjawab semua pertanyaan IPAS dengan baik!</p>
            <button class="btn-action btn-restart" onclick="mulaiUlangGame()">Main Lagi</button>
        </div>
    </div>

    <script>
        const databaseSoal = [
            { soal: "Bagian tumbuhan yang berfungsi untuk menyerap air dan unsur hara dari dalam tanah adalah...", pilihan: ["Akar", "Batang", "Daun", "Bunga"], jawabanBenar: "Akar" },
            { soal: "Proses pembuatan makanan pada tumbuhan hijau dengan bantuan cahaya matahari disebut...", pilihan: ["Respirasi", "Fotosintesis", "Oksidasi", "Evaporasi"], jawabanBenar: "Fotosintesis" },
            { soal: "Zat hijau daun yang berperan penting dalam menangkap cahaya matahari saat fotosintesis adalah...", pilihan: ["Oksigen", "Glukosa", "Klorofil", "Stomata"], jawabanBenar: "Klorofil" },
            { soal: "Bagian bunga yang berfungsi sebagai alat kelamin jantan adalah...", pilihan: ["Putik", "Kelopak", "Mahkota", "Benang Sari"], jawabanBenar: "Benang Sari" },
            { soal: "Gas yang dikeluarkan oleh tumbuhan sebagai hasil dari proses fotosintesis adalah...", pilihan: ["Karbondioksida", "Oksigen", "Nitrogen", "Hidrogen"], jawabanBenar: "Oksigen" },
            { soal: "Benda yang memiliki bentuk dan volume yang tetap atau tidak berubah-ubah termasuk benda...", pilihan: ["Padat", "Cair", "Gas", "Fluida"], jawabanBenar: "Padat" },
            { soal: "Perubahan wujud benda dari zat cair menjadi zat padat akibat penurunan suhu disebut...", pilihan: ["Mencair", "Menguap", "Membeku", "Menyublim"], jawabanBenar: "Membeku" },
            { soal: "Ketika air dipanaskan terus-menerus, air akan berubah menjadi uap. Peristiwa ini disebut...", pilihan: ["Mengembun", "Menguap", "Menyublim", "Mengkristal"], jawabanBenar: "Menguap" },
            { soal: "Bagian tumbuhan yang berfungsi sebagai tempat menyalurkan air dari akar ke daun adalah...", pilihan: ["Buah", "Biji", "Batang", "Bunga"], jawabanBenar: "Batang" },
            { soal: "Peristiwa terbentuknya titik-titik air di bagian luar gelas yang berisi es batu dinamakan...", pilihan: ["Mengembun", "Mencair", "Menguap", "Menyublim"], jawabanBenar: "Mengembun" }
        ];

        const warnaTombol = ["#4caf50", "#2196f3", "#ff9800", "#9c27b0"];
        let sisaPertanyaan = [];
        let pertanyaanAktif = null;
        let nyawa = 3;
        let skor = 0;
        let audioCtx = null;
        let sedangAnimasi = false; 

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Gagal mengaktifkan fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function mainkanSuara(tipe) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {
                console.log("Audio di-skip");
            }
        }

        function klikMulaiGame() {
            document.getElementById('start-screen').classList.add('hidden');
            mainkanSuara('benar'); 
            siapkanKomponenGame();
        }

        function siapkanKomponenGame() {
            nyawa = 3;
            skor = 0;
            sedangAnimasi = false;
            sisaPertanyaan = [...databaseSoal]; 
            perbaruiStatus();
            pilihPertanyaanAcak();
        }

        function mulaiUlangGame() {
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('win-screen').classList.add('hidden');
            siapkanKomponenGame();
        }

        // PERBAIKAN UTAMA: Mengacak susunan letak opsi tombol jawaban
        function buatTombolJawaban(arrayPilihan) {
            const grid = document.getElementById('grid-jawaban');
            grid.innerHTML = ''; 
            
            // Mengclone array agar array asli tidak rusak, lalu mengacak posisinya secara dinamis
            const pilihanTeracak = [...arrayPilihan].sort(() => Math.random() - 0.5);
            
            pilihanTeracak.forEach((teksJawaban, indeks) => {
                const tombol = document.createElement('button');
                tombol.className = 'btn-jawaban';
                tombol.innerText = teksJawaban;
                
                // Memberikan warna dinamis secara berurutan pada tombol yang telah teracak posisinya
                tombol.style.backgroundColor = warnaTombol[indeks % 4]; 
                tombol.onclick = () => cekJawaban(teksJawaban, tombol);
                grid.appendChild(tombol);
            });
        }

        function gantiSoalMajuKeKanan() {
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "slide-out";
            setTimeout(() => {
                if (sisaPertanyaan.length === 0) {
                    document.getElementById('win-screen').classList.remove('hidden');
                    return;
                }
                pilihPertanyaanAcak();
            }, 200);
        }

        function pilihPertanyaanAcak() {
            if (sisaPertanyaan.length === 0) return;
            const indeksAcak = Math.floor(Math.random() * sisaPertanyaan.length);
            pertanyaanAktif = sisaPertanyaan[indeksAcak];
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "";
            txtSoal.innerHTML = pertanyaanAktif.soal; 
            buatTombolJawaban(pertanyaanAktif.pilihan);
            setTimeout(() => { txtSoal.className = "slide-in"; }, 20);
        }

        function cekJawaban(jawabanDipilih, elemenTombol) {
            if (sedangAnimasi) return;
            sedangAnimasi = true;
            const feedbackEl = document.getElementById('feedback');
            if (jawabanDipilih === pertanyaanAktif.jawabanBenar) {
                mainkanSuara('benar');
                skor += 10;
                feedbackEl.innerText = "✓";
                feedbackEl.className = "correct-feedback";
                sisaPertanyaan = sisaPertanyaan.filter(item => item.soal !== pertanyaanAktif.soal);
                setTimeout(() => {
                    feedbackEl.className = "";
                    perbaruiStatus();
                    gantiSoalMajuKeKanan();
                    sedangAnimasi = false;
                }, 600);
            } else {
                mainkanSuara('salah');
                nyawa--;
                feedbackEl.innerText = "✕";
                feedbackEl.className = "wrong-feedback";
                elemenTombol.classList.add('shake'); 
                setTimeout(() => {
                    feedbackEl.className = "";
                    elemenTombol.classList.remove('shake');
                    perbaruiStatus();
                    if (nyawa <= 0) {
                        document.getElementById('skor-akhir-kalah').innerText = `Total Benar: ${skor / 10} dari 10 soal`;
                        document.getElementById('game-over-screen').classList.remove('hidden');
                    } else {
                        gantiSoalMajuKeKanan(); 
                    }
                    sedangAnimasi = false;
                }, 600);
            }
        }

        function perbaruiStatus() {
            document.getElementById('info-nyawa').innerText = `❤️ Nyawa: ${nyawa}`;
            document.getElementById('info-skor').innerText = `Skor: ${skor}`;
        }
    </script>
</body>
</html>
