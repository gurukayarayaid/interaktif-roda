<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Perkalian Kelas 3 SD - Soal Cerita</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f7fb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            position: relative;
            overflow: hidden;
        }

        #main-app-container {
            background: white;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border-radius: 15px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        :fullscreen body {
            overflow: hidden !important;
        }
        :-webkit-full-screen body {
            overflow: hidden !important;
        }

        :fullscreen #main-app-container {
            max-width: 100vw !important;
            width: 100vw !important;
            max-height: 100vh !important;
            height: 100vh !important;
            border-radius: 0 !important;
            padding: 40px 100px !important;
            box-shadow: none !important;
            overflow: hidden !important;
        }
        :-webkit-full-screen #main-app-container {
            max-width: 100vw !important;
            width: 100vw !important;
            max-height: 100vh !important;
            height: 100vh !important;
            border-radius: 0 !important;
            padding: 20px 40px !important;
            box-shadow: none !important;
            overflow: hidden !important;
        }

        .btn-fullscreen {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: #212529;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: bold;
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }
        .btn-fullscreen:hover {
            background-color: #495057;
        }

        .hidden { display: none !important; }

        .wheel-page {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }

        .wheel-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wheel-box {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pointer {
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 15px solid transparent;
            border-bottom: 15px solid transparent;
            border-left: 25px solid #444;
            z-index: 10;
        }

        canvas {
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            max-width: 85vh;
            max-height: 85vh;
            width: 420px;
            height: 420px;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
        }

        :fullscreen canvas {
            width: 70vh;
            height: 70vh;
        }

        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 90%;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-content h2 {
            font-size: 2.5rem;
            color: #ffc107;
            background: #111;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 20px;
            word-wrap: break-word;
        }

        .game-page {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .top-border {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            margin: 5px 0;
        }
        
        .dash {
            width: 35px;
            height: 10px;
            background-color: #ccc;
            border-radius: 4px;
            flex-shrink: 0;
        }

        #status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #333;
            font-size: 1.8rem;
            border-bottom: 2px dashed #ccc;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .provinsi-container {
            width: 100%;
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            padding: 10px;
            min-height: 120px;
        }

        #target-soal {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            position: absolute;
            width: 100%;
            opacity: 0;
            transform: translateX(-100%);
            line-height: 1.5;
            padding: 0 10px;
        }

        :fullscreen #target-soal {
            font-size: 1.8rem;
        }

        .slide-in { animation: slideInAnim 0.4s forwards cubic-bezier(0.175, 0.885, 0.32, 1.15); }
        @keyframes slideInAnim { 0% { transform: translateX(-100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        .slide-out { animation: slideOutAnim 0.4s forwards ease-in; }
        @keyframes slideOutAnim { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }

        #feedback {
            font-size: 7rem;
            font-weight: bold;
            position: absolute;
            top: 20%;
            z-index: 10;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
            pointer-events: none;
        }
        .correct-feedback { color: #4CAF50; opacity: 1 !important; transform: scale(1.2) !important; }
        .wrong-feedback { color: #F44336; opacity: 1 !important; transform: scale(1.2) !important; }

        #grid-jawaban {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 95%;
            margin-bottom: 10px;
        }

        .btn-jawaban {
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px 20px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: transform 0.1s, opacity 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90px;
        }
        :fullscreen .btn-jawaban {
            min-height: 130px;
            font-size: 1.8rem;
        }
        .btn-jawaban:active { transform: scale(0.97); }
        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-8px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-4px); } 100% { transform: translateX(0); } }

        .screen {
            width: 100%;
            max-width: 750px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .screen h1 { font-size: 2.8rem; margin-bottom: 5px; }
        .screen p { font-size: 1.4rem; margin-bottom: 5px; }

        .leaderboard-container {
            width: 100%;
            height: 35vh;
            max-height: 220px;
            overflow-y: auto;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fafafa;
        }
        .leaderboard-container::-webkit-scrollbar {
            width: 6px;
        }
        .leaderboard-container::-webkit-scrollbar-thumb {
            background-color: #ccc;
            border-radius: 4px;
        }

        :fullscreen .leaderboard-container {
            max-height: 38vh;
        }

        .table-leaderboard {
            width: 100%;
            border-collapse: collapse;
            font-size: 1.3rem;
        }

        .table-leaderboard th, .table-leaderboard td {
            padding: 10px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .table-leaderboard th {
            background-color: #ff922b;
            color: white;
            position: sticky;
            top: 0;
        }

        .table-leaderboard tr:nth-child(even) { background-color: #f2f2f2; }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 5px;
        }

        button.btn-general {
            padding: 10px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        :fullscreen button.btn-general {
            padding: 15px 25px;
            font-size: 1.4rem;
        }
        button.btn-general:active { transform: scale(0.98); }

        .btn-spin { background-color: #007bff; color: white; padding: 15px 30px; font-size: 1.5rem; }
        .btn-spin:hover { background-color: #0056b3; }
        
        .btn-eliminate-go { background-color: #d32f2f; color: white; }
        .btn-eliminate-go:hover { background-color: #b71c1c; }

        .btn-keep-go { background-color: #2e7d32; color: white; }
        .btn-keep-go:hover { background-color: #1b5e20; }

        .btn-print { background-color: #17a2b8; color: white; }
        .btn-print:hover { background-color: #138496; }

        .btn-save-data { background-color: #ff922b; color: white; }
        .btn-save-data:hover { background-color: #f57c00; }

        .btn-reset-data {
            background-color: #6c757d;
            color: white;
            grid-column: span 2;
        }
        .btn-reset-data:hover { background-color: #5a6268; }

        @media print {
            body * { visibility: hidden; }
            .printable-area, .printable-area * { visibility: visible; }
            .printable-area { position: absolute; left: 0; top: 0; width: 100%; }
            .leaderboard-container { max-height: none !important; overflow: visible !important; }
            .button-group, h1:not(.print-title), .btn-fullscreen { display: none !important; }
        }
    </style>
</head>
<body>

    <button class="btn-fullscreen" onclick="toggleFullscreen()">
        🖥️ <span id="fullscreen-text"></span>
    </button>

    <div id="main-app-container">
        
        <!-- HALAMAN 1: RODA ACAK BERPUTAR -->
        <div id="page-wheel" class="wheel-page">
            <div class="wheel-area">
                <div class="wheel-box" onclick="spinWheel()" style="cursor: pointer;" title="Klik tengah roda untuk memutar">

                    <canvas id="wheel" width="420" height="420"></canvas>
                </div>
            </div>

            <!-- Textarea dan tombol putar tersembunyi -->
            <div class="hidden">
                <textarea id="namesInput">DAFIN
FIRA
SILA
NAURA

                <div class="dash"></div><div class="dash"></div><div class="dash"></div>
                <div class="dash"></div><div class="dash"></div><div class="dash"></div>
                <div class="dash"></div><div class="dash"></div><div class="dash"></div>

        <!-- HALAMAN 3: SCREEN GAME OVER -->
        <div id="page-game-over" class="screen printable-area hidden">

        <div id="page-win" class="screen printable-area hidden">

            <h3 style="margin-top: 5px; font-size: 1.4rem; color: #333;">🏆 DAFTAR NILAI PERKALIAN KELAS 3 🏆</h3>
            <div class="leaderboard-container">
                <table class="table-leaderboard" id="tabel-leaderboard-menang">

                <button class="btn-general btn-keep-go" onclick="kembaliKeRoda(false)">↩️ Roda (Simpan Nama)</button>
                <button class="btn-general btn-print" onclick="cetakHalaman()">🖨️ Cetak</button>
                <button class="btn-general btn-save-data" onclick="simpanKeFileTeks()">💾 Simpan (.txt)</button>
                <button class="btn-general btn-reset-data" onclick="resetLeaderboardData()">⚠️ Kosongkan Riwayat</button>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let namaSiswa = "";
        let riwayatJawabanSesiIni = []; 

        function playTickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, index) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
                }, index * 100);
            });
        }

        function mainkanSuaraGame(tipe) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                if (tipe === 'benar') {
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
                    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                } else if (tipe === 'salah') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                }
            } catch (e) {}
        }

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const namesInput = document.getElementById("namesInput");
        const modal = document.getElementById("resultModal");
        const winnerNameText = document.getElementById("winnerName");

        let names = [];
        let colors = [];
        let currentRotation = 0;
        let isSpinning = false;
        let selectedIndex = null;
        const colorPalette = ["#3366cc", "#109618", "#ff9900", "#dc3912", "#990099", "#0099c6", "#dd4477", "#66aa00", "#b82e2e", "#316395"];

        function initColors(num) {
            colors = [];
            for (let i = 0; i < num; i++) { colors.push(colorPalette[i % colorPalette.length]); }
        }

        function drawWheel() {
            const numSegments = names.length;
            if (numSegments === 0) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                return;
            }
            const arcSize = (2 * Math.PI) / numSegments;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                ctx.beginPath();
                ctx.fillStyle = colors[i];
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.lineTo(centerX, centerY);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.fillStyle = "white";
                ctx.font = "bold 13px Arial";
                ctx.textAlign = "right";
                ctx.fillText(names[i].substring(0, 16), radius - 20, 5);
                ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(centerX, centerY, 35, 0, 2 * Math.PI);
            ctx.fillStyle = "white"; ctx.fill(); ctx.stroke();
            
            // Tulis teks PUTAR di tengah roda
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.fillStyle = "#333";
            ctx.font = "bold 12px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("PUTAR", 0, 0);
            ctx.restore();
        }

        function updateWheelData() {
            names = namesInput.value.split('\n').map(line => line.trim()).filter(line => line !== "");
            initColors(names.length);
            drawWheel();
        }

        function spinWheel() {
            if (isSpinning || names.length === 0) return;
            isSpinning = true;
            modal.style.display = "none";

            const numSegments = names.length;
            const extraDegrees = Math.floor(Math.random() * 360);
            const totalSpin = 1800 + extraDegrees; 
            currentRotation += totalSpin;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            let duration = 4000;
            let startTime = performance.now();
            let arcSizeDeg = 360 / numSegments;
            let lastSegmentIndex = -1;

            function checkTick(now) {
                let elapsed = now - startTime;
                if (elapsed < duration) {
                    let progress = elapsed / duration;
                    let easeOutProgress = 1 - Math.pow(1 - progress, 3);
                    let currentAngle = (currentRotation - totalSpin) + (totalSpin * easeOutProgress);
                    let relativeAngle = (currentAngle) % 360;
                    let currentSegment = Math.floor(((180 - relativeAngle + 360) % 360) / arcSizeDeg);

                    if (currentSegment !== lastSegmentIndex) {
                        playTickSound();
                        lastSegmentIndex = currentSegment;
                    }
                    requestAnimationFrame(checkTick);
                }
            }
            requestAnimationFrame(checkTick);

            setTimeout(() => {
                isSpinning = false;
                const actualDegrees = (currentRotation) % 360;
                let targetIndex = Math.floor((180 - actualDegrees + 360) % 360 / arcSizeDeg);
                if(targetIndex < 0) targetIndex += numSegments;

                selectedIndex = targetIndex;
                namaSiswa = names[selectedIndex];
                playWinSound();
                winnerNameText.innerText = namaSiswa;
                modal.style.display = "flex";
            }, duration);
        }

        const databaseSoal = [
            { 
                soal: "Ibu membeli 4 kotak kue. Setiap kotak berisi 12 kue. Berapa jumlah seluruh kue yang dibeli ibu?", 
                pilihan: ["48", "36", "44", "52"], 
                jawabanBenar: "48" 
            },
            { 
                soal: "Di dalam kelas ada 5 baris meja belajar. Setiap baris diisi oleh 7 orang siswa. Berapa jumlah total siswa di barisan tersebut?", 
                pilihan: ["35", "30", "42", "28"], 
                jawabanBenar: "35" 
            },
            { 
                soal: "Ayah mempunyai 6 keranjang buah mangga. Tiap keranjang berisi 10 buah mangga. Berapa buah mangga ayah seluruhnya?", 
                pilihan: ["60", "50", "66", "70"], 
                jawabanBenar: "60" 
            },
            { 
                soal: "Budi merawat 8 pot tanaman bunga di halaman rumah. Setiap pot bunga ditumbuhi 9 kuntum bunga. Berapa jumlah seluruh kuntum bunga Budi?", 
                pilihan: ["72", "63", "81", "56"], 
                jawabanBenar: "72" 
            },
            { 
                soal: "Siti memiliki 3 lembar stiker bergambar hewan. Setiap lembar berisi 15 buah stiker. Berapa jumlah keseluruhan stiker Siti?", 
                pilihan: ["45", "35", "40", "50"], 
                jawabanBenar: "45" 
            },
            { 
                soal: "Paman memelihara 7 kandang ayam potong. Tiap kandang berisi 8 ekor ayam. Berapa jumlah seluruh ayam paman?", 
                pilihan: ["56", "48", "64", "54"], 
                jawabanBenar: "56" 
            },
            { 
                soal: "Sekolah membagikan buku tulis kepada 9 anak. Masing-masing anak mendapatkan 6 buah buku tulis. Berapa jumlah seluruh buku yang dibagikan?", 
                pilihan: ["54", "45", "63", "48"], 
                jawabanBenar: "54" 
            },
            { 
                soal: "Ibu guru menyiapkan 4 kotak kapur tulis untuk mengajar. Setiap kotak berisi 15 batang kapur tulis. Berapa total batang kapur tulis tersebut?", 
                pilihan: ["60", "45", "75", "55"], 
                jawabanBenar: "60" 
            },
            { 
                soal: "Rian menyusun buku ke dalam 8 tumpukan rapi. Setiap tumpukan terdiri dari 11 buah buku cerita. Berapa jumlah total buku cerita Rian?", 
                pilihan: ["88", "77", "99", "80"], 
                jawabanBenar: "88" 
            },
            { 
                soal: "Dalam kegiatan kerja bakti, warga membentuk 5 kelompok kerja. Setiap kelompok beranggotakan 9 orang warga. Berapa total warga yang mengikuti kerja bakti?", 
                pilihan: ["45", "40", "50", "36"], 
                jawabanBenar: "45" 
            }
        ];

        const warnaTombol = ["#E51C23", "#00B0FF", "#FF9800", "#4CAF50"];
        let sisaPertanyaan = [];
        let pertanyaanAktif = null;
        let nyawa = 3;
        let skor = 0;
        let sedangAnimasi = false;

        function mulaiKuisPerkalian() {
            modal.style.display = "none";
            document.getElementById('page-wheel').classList.add('hidden');
            document.getElementById('page-game').classList.remove('hidden');

            nyawa = 3;
            skor = 0;
            sedangAnimasi = false;
            sisaPertanyaan = [...databaseSoal];
            riwayatJawabanSesiIni = []; 

            perbaruiStatusGame();
            pilihPertanyaanAcak();
        }

        function perbaruiStatusGame() {
            document.getElementById('info-nama-game').innerText = `Siswa: ${namaSiswa}`;
            document.getElementById('info-nyawa').innerText = `❤️ Nyawa: ${nyawa}`;
            document.getElementById('info-skor').innerText = `Skor: ${skor}`;
        }

        function pilihPertanyaanAcak() {
            if (sisaPertanyaan.length === 0) return;
            const indeksAcak = Math.floor(Math.random() * sisaPertanyaan.length);
            pertanyaanAktif = sisaPertanyaan[indeksAcak];

            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "";
            txtSoal.innerHTML = pertanyaanAktif.soal;
            
            let pilihanAcak = [...pertanyaanAktif.pilihan];
            for (let i = pilihanAcak.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pilihanAcak[i], pilihanAcak[j]] = [pilihanAcak[j], pilihanAcak[i]];
            }

            const letakBenar = pilihanAcak.indexOf(pertanyaanAktif.jawabanBenar) + 1;
            riwayatJawabanSesiIni.push({
                soal: pertanyaanAktif.soal.replace(/<[^>]*>/g, ''), 
                posisiBenar: letakBenar,
                teksBenar: pertanyaanAktif.jawabanBenar
            });

            buatTombolJawaban(pilihanAcak);
            setTimeout(() => { txtSoal.className = "slide-in"; }, 20);
        }

        function buatTombolJawaban(arrayPilihan) {
            const grid = document.getElementById('grid-jawaban');
            grid.innerHTML = '';
            arrayPilihan.forEach((teksJawaban, indeks) => {
                const tombol = document.createElement('button');
                tombol.className = 'btn-jawaban';
                tombol.innerText = teksJawaban;
                tombol.style.backgroundColor = warnaTombol[indeks];
                tombol.onclick = () => cekJawaban(teksJawaban, tombol);
                grid.appendChild(tombol);
            });
        }

        function cekJawaban(jawabanDipilih, elemenTombol) {
            if (sedangAnimasi) return;
            sedangAnimasi = true;
            const feedbackEl = document.getElementById('feedback');

            if (jawabanDipilih === pertanyaanAktif.jawabanBenar) {
                mainkanSuaraGame('benar');
                skor += 10;
                feedbackEl.innerText = "✓";
                feedbackEl.className = "correct-feedback";
                sisaPertanyaan = sisaPertanyaan.filter(item => item.soal !== pertanyaanAktif.soal);

                setTimeout(() => {
                    feedbackEl.className = "";
                    perbaruiStatusGame();
                    gantiSoalMaju();
                    sedangAnimasi = false;
                }, 600);
            } else {
                mainkanSuaraGame('salah');
                nyawa--;
                feedbackEl.innerText = "✕";
                feedbackEl.className = "wrong-feedback";
                elemenTombol.classList.add('shake');

                setTimeout(() => {
                    feedbackEl.className = "";
                    elemenTombol.classList.remove('shake');
                    perbaruiStatusGame();
                    if (nyawa <= 0) {
                        simpanDanTampilkanLeaderboard(false);
                    } else {
                        gantiSoalMaju();
                    }
                    sedangAnimasi = false;
                }, 600);
            }
        }

        function gantiSoalMaju() {
            const txtSoal = document.getElementById('target-soal');
            txtSoal.className = "slide-out";
            setTimeout(() => {
                if (sisaPertanyaan.length === 0) {
                    simpanDanTampilkanLeaderboard(true);
                    return;
                }
                pilihPertanyaanAcak(); 
            }, 400);
        }

        function dapatkanDataLeaderboard() {
            return JSON.parse(localStorage.getItem('kuisPerkalianKelas3Leaderboard')) || [];
        }

        function simpanDanTampilkanLeaderboard(apakahMenang) {
            document.getElementById('page-game').classList.add('hidden');
            let leaderboardData = dapatkanDataLeaderboard();
            
            let dataSiswaLama = leaderboardData.find(item => item.nama === namaSiswa);
            if (dataSiswaLama) {
                if (skor > dataSiswaLama.skor) dataSiswaLama.skor = skor;
            } else {
                leaderboardData.push({ nama: namaSiswa, skor: skor });
            }

            leaderboardData.sort((a, b) => b.skor - a.skor);
            localStorage.setItem('kuisPerkalianKelas3Leaderboard', JSON.stringify(leaderboardData));

            if(apakahMenang) {
                document.getElementById('skor-akhir-menang').innerText = `Skor Akhir Kamu: ${skor}`;
                isiTabelLeaderboard('tabel-leaderboard-menang', leaderboardData);
                document.getElementById('page-win').classList.remove('hidden');
            } else {
                document.getElementById('skor-akhir-kalah').innerText = `Skor Akhir Kamu: ${skor}`;
                isiTabelLeaderboard('tabel-leaderboard-kalah', leaderboardData);
                document.getElementById('page-game-over').classList.remove('hidden');
            }
        }

        function isiTabelLeaderboard(idTabel, data) {
            const tbody = document.getElementById(idTabel).getElementsByTagName('tbody')[0];
            tbody.innerHTML = "";
            data.forEach((item, indeks) => {
                let row = tbody.insertRow();
                let cellRank = row.insertCell(0);
                let cellNama = row.insertCell(1);
                let cellSkor = row.insertCell(2);

                cellRank.innerHTML = indeks === 0 ? `🥇 1` : indeks + 1;
                cellNama.innerText = item.nama;
                cellSkor.innerText = item.skor;

                if(item.nama === namaSiswa) {
                    row.style.fontWeight = 'bold';
                    row.style.backgroundColor = '#fff3bf';
                }
            });
        }

        function kembaliKeRoda(apakahEliminasi) {
            document.getElementById('page-game-over').classList.add('hidden');
            document.getElementById('page-win').classList.add('hidden');
            document.getElementById('page-wheel').classList.remove('hidden');

            if (apakahEliminasi && selectedIndex !== null) {
                names.splice(selectedIndex, 1);
                namesInput.value = names.join("\n");
                selectedIndex = null;
            }
            updateWheelData();
        }

        function cetakHalaman() { window.print(); }

        function simpanKeFileTeks() {
            let data = dapatkanDataLeaderboard();
            if(data.length === 0) { alert("Belum ada data nilai!"); return; }
            let isiTeks = "=== DAFTAR NILAI PERKALIAN KELAS 3 SD ===\r\n\r\n";
            data.forEach((item, indeks) => { isiTeks += `${indeks + 1}. Nama: ${item.nama} | Skor: ${item.skor}\r\n`; });
            
            if(riwayatJawabanSesiIni.length > 0) {
                isiTeks += "\r\n=== LOG LETAK JAWABAN BENAR SESI TERAKHIR (" + namaSiswa + ") ===\r\n";
                riwayatJawabanSesiIni.forEach((item, indeks) => {
                    isiTeks += `${indeks + 1}. Soal: ${item.soal}\r\n   -> Letak Jawaban Benar: Pilihan/Tombol ke-${item.posisiBenar} [${item.teksBenar}]\r\n`;
                });
            }

            let blob = new Blob([isiTeks], { type: "text/plain;charset=utf-8" });
            let linkUnduh = document.createElement("a");
            linkUnduh.href = URL.createObjectURL(blob);
            linkUnduh.download = `daftar_nilai_perkalin_kelas3_${namaSiswa}.txt`;
            document.body.appendChild(linkUnduh);
            linkUnduh.click();
            document.body.removeChild(linkUnduh);
        }

        function resetLeaderboardData() {
            if (confirm("Hapus semua riwayat nilai murid?")) {
                localStorage.removeItem('kuisPerkalianKelas3Leaderboard');
                isiTabelLeaderboard('tabel-leaderboard-kalah', []);
                isiTabelLeaderboard('tabel-leaderboard-menang', []);
                alert("Data berhasil dibersihkan!");
            }
        }

        function toggleFullscreen() {
            const btnText = document.getElementById("fullscreen-text");
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const docElm = document.documentElement;
                if (docElm.requestFullscreen) { docElm.requestFullscreen(); } 
                else if (docElm.webkitRequestFullscreen) { docElm.webkitRequestFullscreen(); } 
                else if (docElm.msRequestFullscreen) { docElm.msRequestFullscreen(); }
                btnText.innerText = "";
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); } 
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); } 
                else if (document.msExitFullscreen) { document.msExitFullscreen(); }
                btnText.innerText = "";
            }
        }

        function monitorFullscreenChange() {
            const btnText = document.getElementById("fullscreen-text");
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                btnText.innerText = "";
            }
        }
        document.addEventListener('fullscreenchange', monitorFullscreenChange);
        document.addEventListener('webkitfullscreenchange', monitorFullscreenChange);
        document.addEventListener('msfullscreenchange', monitorFullscreenChange);

        namesInput.addEventListener("input", updateWheelData);
        updateWheelData();
    </script>
</body>
</html>
